name: Weekly trends

on:
  schedule:
    - cron: "17 0 * * 1"   # 매주 월요일 한국 09:17 (네이버·e-Stat 데이터 새로고침)
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh weekly trend data
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: python -m bot weekly
      - name: Commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trend_latest.json data/estat_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Weekly trend refresh"
          git pull --rebase --autostash
          git push
