name: Daily post

on:
  schedule:
    # 22:07 KST (13:07 UTC). posts_per_day = 1 인 동안은 이 한 번만 게시돼요.
    - cron: "7 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "미리보기만 (체크하면 인스타에 올리지 않고 카드 이미지만 만들어요)"
        type: boolean
        default: true
      source:
        description: "올릴 종류 (auto = config [series] 계획대로 · 나머지 = 그 종류로 · site = 링크 페이지만)"
        type: choice
        options: [auto, city101, hood, gallery, area, hotel, transport, route, season, words, weekly, recap, site]
        default: auto
      reel:
        description: "릴스 (auto = config [reels] 요일대로 · yes = 오늘 릴스도 · no = 카드뉴스만)"
        type: choice
        options: [auto, "yes", "no"]
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Get site address
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare today's post
        id: prepare
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          AGODA_SITE_ID: ${{ secrets.AGODA_SITE_ID }}
          AGODA_API_KEY: ${{ secrets.AGODA_API_KEY }}
          TRIPCOM_AFFILIATE_KEY: ${{ secrets.TRIPCOM_AFFILIATE_KEY }}
          INVOLVE_ASIA_KEY: ${{ secrets.INVOLVE_ASIA_KEY }}
          KTO_API_KEY: ${{ secrets.KTO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          ARGS="--out site --source ${{ inputs.source || 'auto' }} --reel ${{ inputs.reel || 'auto' }}"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m bot prepare $ARGS

      - name: Check connections (preview runs only)
        if: env.DRY_RUN == 'true'
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          AGODA_SITE_ID: ${{ secrets.AGODA_SITE_ID }}
          KTO_API_KEY: ${{ secrets.KTO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m bot check

      - name: Keep card images for review
        if: steps.prepare.outputs.has_post == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-images
          path: |
            site/posts
            site/pins
            site/reels
            pins/*.jpg
          retention-days: 14

      - name: Publish preview cards to a branch (preview runs only)
        if: env.DRY_RUN == 'true' && steps.prepare.outputs.has_post == 'true'
        continue-on-error: true
        run: |
          # so the cards can be looked at in a browser: github.com/<repo>/tree/preview-latest
          mkdir /tmp/pv && cp -r site/posts /tmp/pv/ && cd /tmp/pv
          git init -q && git checkout -q -b preview-latest
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Preview cards"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" preview-latest

      - name: Upload link page + images
        if: steps.prepare.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.prepare.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4

      - name: Publish to Instagram
        if: steps.prepare.outputs.has_post == 'true' && env.DRY_RUN != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m bot publish --site-url "${{ steps.deployment.outputs.page_url }}"

      - name: Save progress
        if: always() && steps.prepare.outputs.has_post == 'true' && env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data pins photos   # whole folders: they always exist, unlike optional files inside them
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update posting state (No.${{ steps.prepare.outputs.number }})"
          git pull --rebase --autostash
          git push
