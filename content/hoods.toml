# 동네 한 곳을 소개하는 자료 ("동네 가이드" 시리즈). 출처 2개 이상 필수.
#
# key       상태 저장용 고유 키
# city      content/cities.toml 의 city key
# title     카드 제목 (동네 이름)
# ko        관광공사 사진 API 검색어 (한국 동네만)
# country   Korea / Japan
# vibe      한두 문장 분위기 소개 (출처 내용을 바꿔 쓴 것)
# do        할 것 3가지
# getting_there  가장 가까운 역
# tip       가기 전에 알아둘 것 한 가지
# sources   출처 링크 2개 이상 (공식 관광 사이트 우선)
#
# 조사일: 2026-09-30. 가격·영업시간처럼 자주 바뀌는 정보는 넣지 않았어요.

[[hood]]
key = "seoul-myeongdong"
city = "seoul"
title = "Myeongdong"
ko = "명동"          # 관광공사 사진 검색어
country = "Korea"
vibe = "Seoul's shopping district: department stores, beauty shops and street food, with a 1898 brick cathedral in the middle. Very international, very busy."
do = [
  "Try street food along the main lanes (skewers, fried potato, tanghulu)",
  "Visit Myeongdong Cathedral outside mass times",
  "Browse the Myeongdong Underground Shopping Center for souvenirs",
]
getting_there = "Myeongdong Station (Line 4); Euljiro 1-ga Station (Line 2) is the other way in"
tip = "Expect heavy tourist crowds, especially in the evening. The cathedral and Namsan Tower glow after dark."
sources = [
  "https://english.visitseoul.net/editorspicks/myeong-dong/ENNlwcnrh",
  "https://www.seoultourism.org/seoul-neighborhoods-guide/",
]

