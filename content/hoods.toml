# ---- Tokyo (조사일: 2026-10-10). 사진은 위키미디어 커먼즈 / Pexels (`en` = 영어 검색어) ----

[[hood]]
key = "tokyo-shibuya"
city = "tokyo"
title = "Shibuya"
en = "Shibuya Tokyo"
country = "Japan"
vibe = "A neon-lit district built around the world-famous scramble crossing. Busy day and night, with cheap fashion, bars and clubs, and quieter cafes on the side streets."
do = [
  "Watch the Scramble Crossing, then see it from above at Shibuya Sky",
  "Meet at the Hachiko statue (go early for a clear photo)",
  "Stroll Center-Gai for cheap food, karaoke and glowing signs after dark",
]
getting_there = "Shibuya Station (many lines; some Narita Express trains stop here). Follow the 'Hachiko' exit signs to the crossing"
tip = "The station is a maze, so allow extra time for transfers. The walkway toward Shibuya Mark City gives a calmer view of the crossing."
sources = [
  "https://www.gotokyo.org/en/story/walks-and-tours/shibuya/index.html",
  "https://www.gotokyo.org/en/spot/1749/index.html",
]

